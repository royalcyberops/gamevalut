<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a21"/>
      <stop offset="0.55" stop-color="#1b2838"/>
      <stop offset="1" stop-color="#2d73ff"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66c0f4"/>
      <stop offset="1" stop-color="#2d73ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect x="40" y="40" width="520" height="820" rx="16" fill="none" stroke="#66c0f4" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Logo mark -->
  <rect x="245" y="300" width="110" height="110" rx="20" fill="url(#logo)"/>
  <text x="300" y="378" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">G</text>
  <!-- Title -->
  <text x="300" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="4" fill="#ffffff">GameVault</text>
  <text x="300" y="520" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" letter-spacing="6" fill="#66c0f4">NO COVER</text>
  <text x="300" y="800" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8f98a0">600 x 900 placeholder</text>
</svg>
